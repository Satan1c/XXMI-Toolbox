name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
      # The oldest Blender the extension supports builds and checks it.
      BLENDER: blender-4.2.9-linux-x64
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the add-on version
        run: |
          version="${TAG#v}"
          manifest=$(sed -n 's/^version = "\(.*\)"$/\1/p' blender_manifest.toml)
          legacy=$(python3 -c 'import ast; tree = ast.parse(open("__init__.py").read()); info = next(n.value for n in tree.body if isinstance(n, ast.Assign) and getattr(n.targets[0], "id", None) == "bl_info"); print(".".join(map(str, ast.literal_eval(info)["version"])))')
          if [ "$version" != "$manifest" ] || [ "$version" != "$legacy" ]; then
            echo "::error::Tag $TAG, blender_manifest.toml $manifest, bl_info $legacy: make them match"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Cache Blender
        id: cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/${{ env.BLENDER }}
          key: ${{ env.BLENDER }}

      - name: Download Blender
        if: steps.cache.outputs.cache-hit != 'true'
        # Outside the checkout: the build packs everything in the source folder that the manifest does not exclude.
        run: curl -sfL "https://download.blender.org/release/Blender4.2/$BLENDER.tar.xz" | tar xJ -C "$RUNNER_TEMP"

      - name: Install Blender's system libraries
        run: sudo apt-get update -q && sudo apt-get install -yq libxi6 libxxf86vm1 libxfixes3 libxrender1 libxkbcommon0 libsm6 libgl1 libegl1

      - name: Build
        run: |
          mkdir dist
          "$RUNNER_TEMP/$BLENDER/blender" --command extension validate .
          "$RUNNER_TEMP/$BLENDER/blender" --command extension build --source-dir . --output-dir dist
          size=$(stat -c %s "dist/xxmi_toolbox-$VERSION.zip")
          if [ "$size" -gt 1000000 ]; then
            echo "::error::The extension zip is $size bytes: something besides the add-on got packed"
            exit 1
          fi
          # Blender 3.6 installs add-ons from a zip holding their folder.
          mkdir -p legacy/xxmi_toolbox
          unzip -q "dist/xxmi_toolbox-$VERSION.zip" -d legacy/xxmi_toolbox
          (cd legacy && zip -qr "../dist/xxmi_toolbox-$VERSION-legacy.zip" xxmi_toolbox)

      - name: Check the extension installs and registers
        run: |
          "$RUNNER_TEMP/$BLENDER/blender" -b --factory-startup --python-exit-code 1 --python-expr "
          import bpy
          bpy.ops.extensions.package_install_files(filepath='$PWD/dist/xxmi_toolbox-$VERSION.zip', repo='user_default', enable_on_install=True)
          assert hasattr(bpy.types.Scene, 'xxmi_toolbox'), 'XXMI Toolbox did not register'
          "

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        # Release notes: a Changes section (what the release was created with, or empty to fill in), then the
        # downloads and updates text, unless the notes already have it.
        run: |
          notes="$RUNNER_TEMP/notes.md"
          body=$(gh release view "$TAG" --json body --jq .body 2> /dev/null || true)
          if ! grep -q "^## Downloads" <<< "$body"; then
            printf '## Changes\n\n%s\n\n' "$body" > "$notes"
            sed "s/{version}/$VERSION/g" .github/release-notes.md >> "$notes"
          fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            [ -f "$notes" ] && gh release edit "$TAG" --notes-file "$notes"
          else
            gh release create "$TAG" --verify-tag --notes-file "$notes"
          fi
          gh release upload "$TAG" dist/*.zip --clobber
